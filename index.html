<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Properties — Luxury Real Estate</title>
    <meta
      name="description"
      content="Discover exclusive luxury properties for sale and rent in the world's most desirable locations. Curated villas, penthouses, and estates from Top Properties."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="Top Properties — Luxury Real Estate" />
    <meta
      property="og:description"
      content="Curated collection of luxury villas, penthouses, and estates in premium locations worldwide."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1200&h=630&fit=crop"
    />

    <!-- Favicon (simple SVG) -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23B20933'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='central' fill='white' font-family='Georgia,serif' font-size='14' font-weight='bold'%3ETP%3C/text%3E%3C/svg%3E"
    />

    <!-- Google Fonts: Bodoni Moda (display serif) + Figtree (body sans) + Young Serif (fallback) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Figtree:wght@300;400;500;600;700;800&family=Young+Serif&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Figtree", sans-serif;
      }
      /* Initial loading state — shows until React hydrates */
      #root:empty {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root:empty::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid #e5e7eb;
        border-top-color: #b10832;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <script>
      // Detect system dark mode preference
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
      // Listen for changes
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
        document.documentElement.classList.toggle("dark", e.matches);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
